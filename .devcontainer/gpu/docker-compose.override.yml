# ============================================================
# GPU-specific overrides
# [Template] research-project-template 由来
# --- [Project] プロジェクト固有の環境変数はここに追記 ---
# ============================================================
services:
  devcontainer:
    build:
      # ★ GPU ベースイメージの版の**単一情報源**（#140 D2 / D2a）。
      #   Dockerfile 側の `ARG BASE_IMAGE` は既定値を持たない。ここだけを書き換える。
      # ★ 追加の固定はしない。NGC の `YY.MM-py3` は日付タグで**実質固定済み**であり、
      #   `latest` 相当の浮動タグではないため（版はすぐ下の1行だけに書く）。
      # ★ INSTALL_TORCH_CPU=false: GPU イメージには PyTorch が同梱されている。
      #   true にすると CPU 版で上書きされて GPU が使えなくなる。
      args:
        BASE_IMAGE: "nvcr.io/nvidia/pytorch:24.12-py3"
        INSTALL_TORCH_CPU: "false"
    # 共通設定の 8gb を GPU 学習向けに引き上げる。
    # 多 GPU / num_workers を増やすほど /dev/shm を使うため、
    # 不足すると DataLoader worker が Bus error で落ちる（原因が分かりにくい）。
    # 64gb は「ホストの RAM に対して十分大きく、実質上限を気にしなくてよい」値。
    # ホストの物理メモリがこれより小さい環境では、その範囲に下げること
    shm_size: "64gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
