<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress</title>
<style>
:root { color-scheme:light dark; --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --card:#f6f8fa;
        --warn-bg:#fff1f0; --warn:#cf222e; --ok:#1a7f37; --work:#0969da; --need:#9a6700; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8d96a0; --line:#30363d; --card:#161b22;
          --warn-bg:#2d1214; --warn:#ff7b72; --ok:#3fb950; --work:#58a6ff; --need:#d29922; }
}
* { box-sizing: border-box; }
body { margin:0 auto; padding:16px; background:var(--bg); color:var(--fg);
       font:14px/1.5 system-ui, sans-serif; max-width:1100px; }
a { color:var(--work); }
header { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; }
h1 { font-size:18px; margin:0; }
.muted { color:var(--muted); font-size:12px; }
#banner { border:2px solid var(--warn); background:var(--warn-bg); color:var(--warn);
          padding:8px 12px; border-radius:6px; margin:12px 0; }
#summary { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; margin:12px 0; }
.group { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:8px 12px; }
.group summary { font-weight:600; }  /* 要約の見出し（K7: 600 以上は h1 とここだけ） */
.group ul { margin:4px 0 0; padding-left:18px; max-height:200px; overflow:auto; }
#bulk, #filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0; }
input[type=search], select, button { padding:4px 8px; background:var(--bg); color:var(--fg);
       border:1px solid var(--line); border-radius:6px; font:inherit; }
input[type=search] { flex:1 1 200px; }
button:disabled { opacity:.6; }
details > summary { cursor:pointer; }
/* カード（.spec/issues/201-progress-cards.md §5-1 K1〜K8）。色は :root の変数だけ */
#tree .card { background:var(--card); border-radius:8px; padding:6px 10px; margin:4px 0; }
#tree .card .card, #tree .lone > .card { margin-left:12px; border-left:1px solid var(--line); }
#tree .lone > summary { color:var(--muted); font-size:12px; margin:8px 0 4px; }
.card > summary { list-style:none; }
.card > summary::-webkit-details-marker { display:none; }
details.card > summary .head::before { content:"▸"; color:var(--muted); font-size:11px; }
details.card[open] > summary .head::before { content:"▾"; }
.head { display:flex; flex-wrap:wrap; gap:2px 6px; align-items:baseline; }
.head .kind { color:var(--muted); font-size:11px; }
.head .num { color:var(--muted); font-size:12px; }
.head .title { font-size:14px; font-weight:400; color:var(--fg); text-decoration:none; }
.head .title:hover, .head .title:focus { text-decoration:underline; }
.right { margin-left:auto; display:inline-flex; flex-wrap:wrap; gap:4px; align-items:center; }
.meta { display:block; font-size:12px; color:var(--muted); }
.badge { display:inline-block; font-size:12px; padding:0 6px; border-radius:10px;
         border:1px solid var(--line); color:var(--muted); }
.b-work { border-color:var(--work); color:var(--work); }
.b-need { border-color:var(--need); color:var(--need); }
.b-done { border-color:var(--ok); color:var(--ok); }
.b-mark { border-color:var(--warn); color:var(--warn); }
.c-anom { border-color:var(--warn); color:var(--warn); }
.c-stale { border:none; color:var(--muted); padding:0; }
.steps { display:inline-flex; gap:2px; }
.st { display:inline-block; width:8px; height:8px; border-radius:2px; border:1px solid var(--muted); }
.st-done { background:var(--muted); }
.st-none { border-style:dotted; border-color:var(--line); }
.next-step { color:var(--muted); font-size:12px; }
button.close { border:none; background:none; color:var(--muted); font-size:12px; padding:0 4px; cursor:pointer; }
button.close:hover, button.close:focus { color:var(--warn); }
.confirm { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; margin-top:4px; }
.confirm .danger { border-color:var(--warn); color:var(--warn); }
#bulk button[aria-pressed="true"] { background:var(--work); color:var(--bg); border-color:var(--work); }
#bulk-state { color:var(--muted); font-size:12px; }
.rules { color:var(--muted); font-size:12px; margin:4px 0; }
.rules ul { margin:4px 0; padding-left:18px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Progress</h1>
  <span class="muted" id="when">取得中…</span>
</header>
<div id="banner" role="status" hidden></div>
<section id="summary" aria-label="要約"></section>
<div id="bulk" role="group" aria-label="一括の開閉">
  <button type="button" data-level="1">epic まで開く</button>
  <button type="button" data-level="2">task まで開く</button>
  <button type="button" data-level="3">すべて開く</button>
  <button type="button" data-level="0">すべて閉じる</button>
  <span id="bulk-state" role="status"></span>
</div>
<div id="filters" role="search">
  <label><input type="checkbox" name="closed"> closed も表示</label>
  <label><input type="checkbox" name="marks"> 逸脱の印と注記を表示</label>
  <select name="label" aria-label="ラベルで絞り込み"><option value="">ラベル: すべて</option></select>
  <input type="search" name="q" aria-label="タイトルか番号で絞り込み" placeholder="タイトル・#番号で絞り込み" maxlength="200">
  <button type="button" id="refresh">取り直す</button>
</div>
<div id="rules"></div>
<main id="tree"></main>
<script src="/page.js"></script>
</body>
</html>
